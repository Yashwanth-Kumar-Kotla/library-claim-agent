[project]
name = "libraryclaim"
version = "0.1.0"
description = "Live voice-and-vision agent that inventories, measures and prices a home library for a contents claim."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=2.24.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "opencv-contrib-python>=4.10",
    "pillow>=11.0",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libraryclaim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
